<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lewis Ubebe | Professional Certifications</title>
  <meta name="description" content="Lewis Ubebe's verified IT and Cloud Certifications: AWS Certified Cloud Practitioner, CompTIA Security+, Network+, A+, and IT Fundamentals.">
  <style>
    /* Base & Reset - Professional, No Emojis */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav div:first-child {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.2px;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 1.8rem;
      font-weight: 500;
      transition: 0.2s;
      padding-bottom: 4px;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #38bdf8;
    }

    /* Header */
    header {
      text-align: center;
      padding: 3rem 2rem 1.5rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(to right, #f0f9ff, #7dd3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: -0.3px;
    }

    header p {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Section container */
    section {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1rem 2rem 3rem;
    }

    /* Filter bar - clean & minimal */
    .filter-section {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem 0 2rem;
    }

    .filter-btn {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 8px 24px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      color: #cbd5e1;
      letter-spacing: 0.3px;
      font-family: inherit;
    }

    .filter-btn:hover {
      background: #334155;
      border-color: #5b8cbf;
      color: white;
    }

    .filter-btn.active {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    /* Cert Grid Cards - Professional Card Design */
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px;
      margin-top: 20px;
    }

    .cert-card {
      background: #1e293b;
      border-radius: 24px;
      padding: 28px 20px 24px;
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.2s;
      border: 1px solid #334155;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    .cert-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.5);
      border-color: #38bdf8;
      background: #263445;
    }

    .cert-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      transition: transform 0.2s;
    }

    .cert-card:hover .cert-logo {
      transform: scale(1.02);
    }

    /* Fallback style for logos that fail to load */
    .cert-logo-fallback {
      width: 100px;
      height: 100px;
      background: linear-gradient(145deg, #2d3a54, #1e293b);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
      font-size: 2.5rem;
      font-weight: 600;
      color: #38bdf8;
      border: 1px solid #475569;
      font-family: monospace;
    }

    .cert-card h3 {
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .cert-card p {
      color: #a0afc3;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .cert-date {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 12px;
      background: #0f172a60;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      letter-spacing: 0.3px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid #1e293b;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #5b6e8c;
    }

    .empty-message {
      text-align: center;
      padding: 60px 20px;
      background: #1e293b;
      border-radius: 32px;
      color: #94a3b8;
      font-size: 1rem;
      grid-column: 1 / -1;
    }

    @media (max-width: 640px) {
      nav {
        flex-direction: column;
        gap: 10px;
      }
      nav a {
        margin: 0 12px;
      }
      header h1 {
        font-size: 1.8rem;
      }
      .cert-grid {
        gap: 20px;
      }
    }
  </style>
</head>
<body>

<nav>
  <div>Lewis Ubebe</div>
  <div>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="accreditions.html" style="border-bottom: 2px solid #38bdf8;">Certifications</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<header>
  <h1>Professional Certifications</h1>
  <p>Click any badge to view my verified credential</p>
</header>

<section id="certifications">
  <div class="filter-section">
    <button data-filter="all" class="filter-btn active">All</button>
    <button data-filter="cloud" class="filter-btn">Cloud</button>
    <button data-filter="security" class="filter-btn">Security</button>
    <button data-filter="networking" class="filter-btn">Networking</button>
    <button data-filter="fundamentals" class="filter-btn">Fundamentals</button>
  </div>

  <div class="cert-grid" id="certGrid"></div>
</section>

<footer>
  © 2026 Lewis Ubebe | Built with modern web standards | All certifications verifiable on request
</footer>

<script>
  // CERTIFICATION DATABASE - UPDATED WITH AWS CERTIFIED CLOUD PRACTITIONER
  // All certificate links and details are accurate
  const certifications = [
    {
      name: "AWS Certified Cloud Practitioner",
      issuer: "Amazon Web Services (AWS)",
      logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Amazon_Web_Services_Logo.svg/1200px-Amazon_Web_Services_Logo.svg.png",
      certificateLink: "https://cp.certmetrics.com/amazon/en/public/verify/credential/4edf4440a4e74e93982847bf38fc31f8",
      category: "cloud",
      date: "2026",
      abbreviation: "AWS"
    },
    {
      name: "CompTIA Security+",
      issuer: "CompTIA",
      logoUrl: "https://images.credly.com/size/340x340/images/74790a75-8451-4a9e-9fdd-90c1934d05ef/CompTIA_Security_2B.png",
      certificateLink: "https://cp.certmetrics.com/comptia/en/public/verify/credential/466d3100a958480ebbf5283c26f72551",
      category: "security",
      date: "2026",
      abbreviation: "SEC+"
    },
    {
      name: "CompTIA Network+",
      issuer: "Udemy",
      logoUrl: "https://cdn.worldvectorlogo.com/logos/udemy-2.svg",
      certificateLink: "https://www.udemy.com/certificate/UC-9128ac5d-1cac-4cfa-8a6b-628b808051a3/",
      category: "networking",
      date: "2025",
      abbreviation: "NET+"
    },
    {
      name: "CompTIA A+",
      issuer: "Udemy",
      logoUrl: "https://cdn.worldvectorlogo.com/logos/udemy-2.svg",
      certificateLink: "https://www.udemy.com/certificate/UC-82d5c798-7745-4b7d-a7bc-cd910c9a494e/",
      category: "fundamentals",
      date: "2025",
      abbreviation: "A+"
    },
    {
      name: "CompTIA IT Fundamentals (ITF+)",
      issuer: "Udemy",
      logoUrl: "https://cdn.worldvectorlogo.com/logos/udemy-2.svg",
      certificateLink: "https://www.udemy.com/certificate/UC-c70bf2b2-fda2-4faa-9103-f571444abaa5/",
      category: "fundamentals",
      date: "2024",
      abbreviation: "ITF+"
    }
  ];

  let activeFilter = "all";

  // Helper: Creates a consistent fallback element when an image fails to load
  function createFallbackElement(certName, abbreviation) {
    const fallbackDiv = document.createElement('div');
    fallbackDiv.className = 'cert-logo-fallback';
    // Extract first letters or display abbreviation
    let displayText = '';
    if (certName.includes('AWS')) displayText = 'AWS';
    else if (certName.includes('Security+')) displayText = 'SEC+';
    else if (certName.includes('Network+')) displayText = 'NET+';
    else if (certName.includes('A+')) displayText = 'A+';
    else if (certName.includes('IT Fundamentals')) displayText = 'ITF+';
    else displayText = abbreviation || certName.substring(0, 3).toUpperCase();
    fallbackDiv.textContent = displayText;
    fallbackDiv.style.fontSize = '2rem';
    fallbackDiv.style.fontWeight = '700';
    fallbackDiv.style.fontFamily = "'Inter', monospace";
    return fallbackDiv;
  }

  function renderCertifications() {
    const grid = document.getElementById('certGrid');
    
    let filteredCerts = certifications;
    if (activeFilter !== "all") {
      filteredCerts = certifications.filter(cert => cert.category === activeFilter);
    }

    if (filteredCerts.length === 0) {
      grid.innerHTML = `<div class="empty-message">No certifications available in this category. Please check other filters.</div>`;
      return;
    }

    // Clear grid before re-rendering
    grid.innerHTML = '';

    filteredCerts.forEach(cert => {
      // Create card anchor element
      const cardLink = document.createElement('a');
      cardLink.href = cert.certificateLink;
      cardLink.target = '_blank';
      cardLink.rel = 'noopener noreferrer';
      cardLink.className = 'cert-card';

      // Create logo container (img with fallback)
      const img = document.createElement('img');
      img.src = cert.logoUrl;
      img.alt = `${cert.name} logo`;
      img.className = 'cert-logo';
      img.loading = 'lazy';
      
      // Handle image error: replace with custom fallback div
      img.onerror = function() {
        // Prevent infinite loop
        if (img.parentNode) {
          const fallbackElem = createFallbackElement(cert.name, cert.abbreviation);
          img.replaceWith(fallbackElem);
        }
      };

      // Create title
      const title = document.createElement('h3');
      title.textContent = cert.name;
      
      // Create issuer paragraph
      const issuerPara = document.createElement('p');
      issuerPara.textContent = cert.issuer;
      
      // Create date span
      const dateSpan = document.createElement('div');
      dateSpan.className = 'cert-date';
      dateSpan.textContent = `${cert.date}`;
      
      // Append everything
      cardLink.appendChild(img);
      cardLink.appendChild(title);
      cardLink.appendChild(issuerPara);
      cardLink.appendChild(dateSpan);
      
      grid.appendChild(cardLink);
    });
  }

  // Filter button logic with smooth active state
  const filterButtons = document.querySelectorAll('.filter-btn');
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const filterValue = btn.getAttribute('data-filter');
      activeFilter = filterValue;
      // Update active class on buttons
      filterButtons.forEach(button => button.classList.remove('active'));
      btn.classList.add('active');
      renderCertifications();
    });
  });

  // Initial render
  renderCertifications();
</script>
</body>
</html>
